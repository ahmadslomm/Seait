name: seait
description: Seait — modern voice-social app (== com.waig.nalo / ZaffaLive), real API.
publish_to: none
environment: { sdk: ">=3.3.0 <4.0.0" }
dependencies:
  flutter: { sdk: flutter }
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.0
  dio: ^5.4.0
  crypto: ^3.0.3
  socket_io_client: ^2.0.3
  cached_network_image: ^3.3.1
  google_fonts: ^6.2.1
  svgaplayer_flutter: ^2.2.0   # SVGA gift animations (same format nalo/HelloYo use)
  # libpag — PAG bomb/combo animations. Vendored under third_party/pag because
  # upstream pag 1.0.7 still ships Flutter's v1 Android embedding
  # (FlutterNativeView / PluginRegistry.Registrar), removed in Flutter 3.29+.
  # The vendored copy drops only that dead v1 path (v2 onAttachedToEngine is
  # untouched) and sets namespace/compileSdk 34/JVM 17 for AGP 8.
  pag:
    path: third_party/pag
  path_provider: ^2.1.2        # unknown-gifts.log location
  archive: ^3.6.1              # unpack the infoBgImg decoration zip
  video_player: ^2.9.2         # animated profile background (RGB+alpha mp4)
# svgaplayer_flutter pins http ^0.13 while google_fonts/cache_manager need ^1.x.
# Both only use http.get + bodyBytes (unchanged across 0.13→1.x), so align on 1.x.
dependency_overrides:
  http: ^1.2.0
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/emoji/face_11/
    - assets/emoji/face_58/
    - assets/emoji/face_59/
    - assets/images/
    - assets/pag/bomb/
    - assets/pag/cp/
    - assets/pag/gift/
    - assets/pag/home/
    - assets/pag/kroom/
    - assets/pag/loading/
    - assets/pag/lucky/
    - assets/pag/main/
    - assets/pag/rank/
    - assets/pag/topbanner/
    - assets/pag/userspace/
    - assets/pag/yinbo/
    - assets/roomEmoji/face_11/
    - assets/roomEmoji/face_58/
    - assets/roomEmoji/face_59/
    - assets/svga/bomb/
    - assets/svga/cp/
    - assets/svga/dj/
    - assets/svga/dynamic/
    - assets/svga/friend/
    - assets/svga/gift/
    - assets/svga/guide/
    - assets/svga/home/
    - assets/svga/hosttag/
    - assets/svga/kroom/
    - assets/svga/live/
    - assets/svga/medal/
    - assets/svga/rocket/
    - assets/svga/userspace/
    - assets/svga/yinbo/
    - assets/ui/
