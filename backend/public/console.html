<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seait — Control Panel</title>
<style>
  :root{
    --bg:#140a22; --bg2:#1c1030; --card:#241536; --line:#33244a;
    --txt:#ede7f6; --dim:#a294c0; --gold:#e7c46b; --pur:#7b46f6; --pur2:#9a6bff;
    --ok:#4caf7d; --bad:#e0556b; --radius:12px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
    font:14px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif}
  a{color:var(--pur2);text-decoration:none}
  button{font:inherit;cursor:pointer;border:none;border-radius:8px;padding:8px 14px;
    background:var(--pur);color:#fff;transition:.15s}
  button:hover{background:var(--pur2)}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--dim)}
  button.ghost:hover{border-color:var(--pur2);color:var(--txt)}
  button.sm{padding:5px 10px;font-size:12px}
  button.danger{background:transparent;border:1px solid var(--bad);color:var(--bad)}
  button.danger:hover{background:var(--bad);color:#fff}
  input,select,textarea{font:inherit;width:100%;padding:9px 11px;border-radius:8px;
    background:var(--bg2);border:1px solid var(--line);color:var(--txt)}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pur2)}
  label{display:block;font-size:12px;color:var(--dim);margin:12px 0 4px}
  .row{display:flex;gap:10px;align-items:center}
  .pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600}
  .pill.on{background:rgba(76,175,125,.18);color:var(--ok)}
  .pill.off{background:rgba(224,85,107,.16);color:var(--bad)}
  .muted{color:var(--dim)}

  /* login */
  #login{display:flex;align-items:center;justify-content:center;height:100%}
  #login .box{background:var(--card);padding:34px;border-radius:16px;width:340px;
    border:1px solid var(--line)}
  #login h1{margin:0 0 4px;font-size:20px}
  #login .sub{color:var(--dim);margin-bottom:20px;font-size:13px}
  #login button{width:100%;margin-top:18px;padding:11px}
  #login .err{color:var(--bad);font-size:13px;margin-top:12px;min-height:18px}

  /* shell */
  #shell{display:none;height:100%}
  #shell.on{display:grid;grid-template-columns:240px 1fr}
  aside{background:var(--bg2);border-right:1px solid var(--line);overflow-y:auto;padding:16px 0}
  aside .brand{padding:0 20px 14px;font-weight:700;font-size:16px;color:var(--gold);
    display:flex;align-items:center;gap:8px}
  aside .grp{padding:14px 20px 6px;font-size:11px;text-transform:uppercase;
    letter-spacing:.08em;color:var(--dim)}
  aside .nav{padding:9px 20px;display:flex;gap:9px;align-items:center;cursor:pointer;
    border-left:3px solid transparent;font-size:13px}
  aside .nav:hover{background:var(--card)}
  aside .nav.sel{background:var(--card);border-left-color:var(--pur2);color:#fff}
  aside .who{padding:14px 20px;border-top:1px solid var(--line);margin-top:10px;font-size:12px}
  main{overflow-y:auto;padding:26px 32px}
  .head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
  .head h2{margin:0;font-size:20px}
  .toolbar{display:flex;gap:10px;align-items:center}
  .toolbar input{width:220px}

  /* dashboard */
  .stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
  .stat .n{font-size:24px;font-weight:700}
  .stat .l{color:var(--dim);font-size:12px;margin-top:2px}

  /* table */
  table{width:100%;border-collapse:collapse;background:var(--card);
    border-radius:var(--radius);overflow:hidden}
  th,td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--line);font-size:13px}
  th{color:var(--dim);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
  tr:last-child td{border-bottom:none}
  td img{height:34px;width:34px;object-fit:cover;border-radius:6px;background:var(--bg2);vertical-align:middle}
  .actions{display:flex;gap:6px;justify-content:flex-end}

  /* modal */
  .scrim{position:fixed;inset:0;background:rgba(6,3,14,.72);display:none;
    align-items:center;justify-content:center;z-index:50}
  .scrim.on{display:flex}
  .modal{background:var(--card);border:1px solid var(--line);border-radius:16px;
    width:520px;max-width:94vw;max-height:90vh;overflow-y:auto;padding:24px}
  .modal h3{margin:0 0 16px}
  .modal .foot{display:flex;gap:10px;justify-content:flex-end;margin-top:22px}
  .assetfield{display:flex;gap:8px;align-items:center}
  .assetfield img{height:40px;width:40px;object-fit:cover;border-radius:6px;background:var(--bg2)}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
    background:var(--card);border:1px solid var(--line);padding:12px 20px;border-radius:10px;
    z-index:80;opacity:0;transition:.3s;pointer-events:none}
  .toast.on{opacity:1}
  .toast.bad{border-color:var(--bad);color:var(--bad)}
  .empty{padding:40px;text-align:center;color:var(--dim)}
  /* asset picker grid */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px;max-height:340px;overflow-y:auto}
  .grid .a{border:2px solid var(--line);border-radius:8px;padding:6px;cursor:pointer;text-align:center;font-size:10px}
  .grid .a:hover{border-color:var(--pur2)}
  .grid .a img{height:56px;width:56px;object-fit:contain}
  .grid .a .nm{color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="box">
    <h1>Seait Console</h1>
    <div class="sub">Operator sign-in</div>
    <label>Username</label>
    <input id="u" autocomplete="username" autofocus>
    <label>Password</label>
    <input id="p" type="password" autocomplete="current-password">
    <button onclick="doLogin()">Sign in</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<!-- SHELL -->
<div id="shell">
  <aside>
    <div class="brand">⬡ Seait</div>
    <div id="nav"></div>
    <div class="who" id="who"></div>
  </aside>
  <main id="main"></main>
</div>

<div class="scrim" id="scrim"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
const API='/admin/api';
let TOKEN=localStorage.getItem('seait_admin_token')||'';
let ME=null, MENU=null, ASSET_BASE='/assets/';
let CUR=null; // current entity key or special view

// ── fetch helper ──────────────────────────────────────────────────────
async function api(path,opts={}){
  const h=opts.headers||{};
  if(TOKEN) h['Authorization']='Bearer '+TOKEN;
  if(opts.body && !(opts.body instanceof FormData)){ h['Content-Type']='application/json'; opts.body=JSON.stringify(opts.body); }
  const r=await fetch(API+path,{...opts,headers:h});
  if(r.status===401){
    // Session gone. Drop to the login screen WITHOUT reloading — a reload here
    // would loop, since boot() itself calls a guarded route.
    TOKEN=''; localStorage.removeItem('seait_admin_token'); showLogin();
    throw new Error('auth');
  }
  const t=await r.text();
  let j; try{j=JSON.parse(t)}catch{ j={raw:t} }
  if(!r.ok) throw new Error(j.message||j.error||('http '+r.status));
  return j;
}
function showLogin(){
  document.getElementById('shell').classList.remove('on');
  document.getElementById('login').style.display='flex';
}
function assetUrl(p){ if(!p) return ''; if(/^https?:/.test(p)) return p; return ASSET_BASE.replace(/\/$/,'')+'/'+p.replace(/^\//,''); }
function toast(msg,bad){ const t=document.getElementById('toast'); t.textContent=msg; t.className='toast on'+(bad?' bad':''); setTimeout(()=>t.className='toast',2200); }
function esc(s){ return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// ── auth ──────────────────────────────────────────────────────────────
async function doLogin(){
  const u=document.getElementById('u').value.trim(), p=document.getElementById('p').value;
  const e=document.getElementById('loginErr'); e.textContent='';
  try{
    const r=await fetch(API+'/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
    const j=await r.json();
    if(!j.ok){ e.textContent='Invalid username or password'; return; }
    TOKEN=j.token; localStorage.setItem('seait_admin_token',TOKEN); ME=j.admin;
    boot();
  }catch(err){ e.textContent='Sign-in failed: '+err.message; }
}
function logout(){ TOKEN=''; localStorage.removeItem('seait_admin_token'); ME=null; showLogin(); }
document.getElementById('p').addEventListener('keydown',e=>{ if(e.key==='Enter') doLogin(); });

// ── boot ──────────────────────────────────────────────────────────────
async function boot(){
  // No token → straight to login; never call a guarded route first (that path
  // is what caused a reload loop).
  if(!TOKEN){ showLogin(); return; }
  try{
    if(!ME) ME=(await api('/me')).admin;
    MENU=await api('/menu');
    document.getElementById('login').style.display='none';
    document.getElementById('shell').classList.add('on');
    document.getElementById('who').innerHTML=`Signed in as <b>${esc(ME.username)}</b><br><span class="muted">${esc(ME.role)}</span> · <a onclick="logout()">Log out</a>`;
    buildNav();
    showDashboard();
  }catch(err){ showLogin(); }
}

function buildNav(){
  const labels={assets:'Assets',economy:'Economy',system:'System'};
  let h=`<div class="nav sel" data-k="__dash" onclick="pick(this,'__dash')">📊 Dashboard</div>`;
  for(const g of ['assets','economy','system']){
    if(!MENU[g] || !MENU[g].length) continue;
    h+=`<div class="grp">${labels[g]}</div>`;
    for(const e of MENU[g]) h+=`<div class="nav" data-k="${e.key}" onclick="pick(this,'${e.key}')">${e.icon||'▪'} ${esc(e.label)}</div>`;
  }
  h+=`<div class="grp">Tools</div>`;
  h+=`<div class="nav" data-k="__users" onclick="pick(this,'__users')">🪙 Users &amp; Balances</div>`;
  h+=`<div class="nav" data-k="__audit" onclick="pick(this,'__audit')">📜 Audit Log</div>`;
  if(ME.role==='super') h+=`<div class="nav" data-k="__admins" onclick="pick(this,'__admins')">🛡️ Admins</div>`;
  document.getElementById('nav').innerHTML=h;
}
function pick(el,k){
  document.querySelectorAll('aside .nav').forEach(n=>n.classList.remove('sel'));
  el.classList.add('sel');
  if(k==='__dash') showDashboard();
  else if(k==='__users') showUsers();
  else if(k==='__audit') showAudit();
  else if(k==='__admins') showAdmins();
  else showEntity(k);
}

// ── dashboard ─────────────────────────────────────────────────────────
async function showDashboard(){
  const m=document.getElementById('main');
  m.innerHTML=`<div class="head"><h2>Dashboard</h2></div><div class="stats" id="stats"></div>`;
  const d=await api('/dashboard');
  const cards=[
    ['Users',d.users],['Live rooms',d.rooms],['Active gifts',d.activeGifts],
    ['Active products',d.activeProducts],['Coins in circulation',d.coinsInCirculation],
    ['Diamonds in circulation',d.diamondsInCirculation],['Gifts sent',d.giftsSent],
    ['Transactions',d.transactions],['Admins',d.admins],['Audit entries',d.auditEntries],
  ];
  document.getElementById('stats').innerHTML=cards.map(([l,n])=>`<div class="stat"><div class="n">${esc(n)}</div><div class="l">${l}</div></div>`).join('');
}

// ── generic entity view ───────────────────────────────────────────────
let ENTITY=null, ROWS=[];
async function showEntity(key,q){
  CUR=key;
  const r=await api('/entity/'+key+(q?('?q='+encodeURIComponent(q)):''));
  ENTITY=r.entity; ROWS=r.list;
  const m=document.getElementById('main');
  const canCreate=!ENTITY.noCreate;
  m.innerHTML=`<div class="head"><h2>${esc(ENTITY.label)}</h2>
    <div class="toolbar">
      <input id="q" placeholder="Search…" value="${esc(q||'')}" onkeydown="if(event.key==='Enter')showEntity('${key}',this.value)">
      ${canCreate?`<button onclick="openForm('${key}')">+ New</button>`:''}
    </div></div>
    <div id="tbl"></div>`;
  renderTable();
}
function cell(f,v){
  if(f==='active') return v?'<span class="pill on">Active</span>':'<span class="pill off">Off</span>';
  if(f==='force'||f==='fullscreen') return v?'<span class="pill on">Yes</span>':'<span class="muted">no</span>';
  const fd=ENTITY.fields.find(x=>x.name===f);
  if(fd&&fd.type==='asset'&&v) return `<img src="${esc(assetUrl(v))}" onerror="this.style.opacity=.2">`;
  if(fd&&fd.type==='enum'){ const o=(fd.options||[]).find(o=>String(o.value)===String(v)); if(o) return esc(o.label); }
  return esc(v??'');
}
function renderTable(){
  const cols=ENTITY.columns;
  if(!ROWS.length){ document.getElementById('tbl').innerHTML='<div class="empty">Nothing here yet.</div>'; return; }
  let h=`<table><thead><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}<th></th></tr></thead><tbody>`;
  for(const row of ROWS){
    h+=`<tr>${cols.map(c=>`<td>${cell(c,row[c])}</td>`).join('')}
      <td class="actions">
        ${ENTITY.fields.some(f=>f.name==='active')?`<button class="ghost sm" onclick="toggle('${row[ENTITY.id]}')">${row.active?'Disable':'Enable'}</button>`:''}
        <button class="ghost sm" onclick="openForm('${CUR}','${row[ENTITY.id]}')">Edit</button>
        ${ENTITY.noDelete?'':`<button class="danger sm" onclick="del('${row[ENTITY.id]}')">Delete</button>`}
      </td></tr>`;
  }
  document.getElementById('tbl').innerHTML=h+'</tbody></table>';
}
async function toggle(id){ try{ await api('/entity/'+CUR+'/'+id+'/toggle',{method:'POST'}); toast('Updated'); showEntity(CUR); }catch(e){ toast(e.message,1); } }
async function del(id){ if(!confirm('Delete this item?'))return; try{ await api('/entity/'+CUR+'/'+id,{method:'DELETE'}); toast('Deleted'); showEntity(CUR); }catch(e){ toast(e.message,1); } }

// ── entity form ───────────────────────────────────────────────────────
async function openForm(key,id){
  const ent=ENTITY&&ENTITY.key===key?ENTITY:(await api('/entity/'+key)).entity;
  let data={};
  if(id!=null){ data=await api('/entity/'+key+'/'+id); }
  let h=`<h3>${id!=null?'Edit':'New'} — ${esc(ent.label)}</h3>`;
  for(const f of ent.fields){
    if(f.type==='readonly') continue;
    const v=data[f.name]!==undefined?data[f.name]:(f.default!==undefined?f.default:'');
    // The primary key is fixed after create; show it disabled on edit so it is
    // clear it cannot change (the server refuses to change it regardless).
    if(id!=null && f.name===ent.id){
      h+=`<label>${esc(f.label||f.name)}</label><input value="${esc(v)}" disabled style="opacity:.6">`;
      continue;
    }
    h+=`<label>${esc(f.label||f.name)}${f.required?' *':''}</label>`;
    if(f.type==='bool'){
      h+=`<select data-f="${f.name}"><option value="true"${v===true||v==='true'?' selected':''}>Yes</option><option value="false"${!(v===true||v==='true')?' selected':''}>No</option></select>`;
    }else if(f.type==='enum'){
      h+=`<select data-f="${f.name}">${f.options.map(o=>`<option value="${esc(o.value)}"${String(o.value)===String(v)?' selected':''}>${esc(o.label)}</option>`).join('')}</select>`;
    }else if(f.type==='text'||f.type==='json'){
      const val=f.type==='json'&&v&&typeof v==='object'?JSON.stringify(v,null,2):v;
      h+=`<textarea data-f="${f.name}" rows="3">${esc(val)}</textarea>`;
    }else if(f.type==='asset'){
      h+=`<div class="assetfield">
        <img id="prev_${f.name}" src="${esc(assetUrl(v))}" onerror="this.style.opacity=.15">
        <input data-f="${f.name}" id="in_${f.name}" value="${esc(v)}" placeholder="relative path or url" oninput="document.getElementById('prev_${f.name}').src='${'/assets/'}'+this.value">
        <button type="button" class="ghost sm" onclick="pickAsset('${f.name}','${f.asset||'any'}')">Library</button>
      </div>`;
    }else{
      const t=(f.type==='int'||f.type==='bigint')?'text':'text';
      h+=`<input data-f="${f.name}" type="${t}" value="${esc(v)}" ${f.help?`placeholder="${esc(f.help)}"`:''}>`;
    }
    if(f.help && f.type!=='asset') h+=`<div class="muted" style="font-size:11px;margin-top:3px">${esc(f.help)}</div>`;
  }
  h+=`<div class="foot"><button class="ghost" onclick="closeModal()">Cancel</button>
      <button onclick="saveForm('${key}',${id!=null?`'${id}'`:'null'})">Save</button></div>`;
  openModal(h);
}
function collectForm(){
  const o={};
  document.querySelectorAll('#modal [data-f]').forEach(el=>{ o[el.dataset.f]=el.value; });
  return o;
}
async function saveForm(key,id){
  const body=collectForm();
  try{
    if(id!=null) await api('/entity/'+key+'/'+id,{method:'PUT',body});
    else await api('/entity/'+key,{method:'POST',body});
    closeModal(); toast('Saved'); showEntity(key);
  }catch(e){ toast(e.message,1); }
}

// ── asset picker ──────────────────────────────────────────────────────
async function pickAsset(field,kind){
  const r=await api('/assets'+(kind&&kind!=='any'?('?kind='+kind):''));
  let h=`<h3>Asset library</h3>
    <div class="row" style="margin-bottom:14px">
      <input type="file" id="upf" style="flex:1">
      <button onclick="uploadAsset('${field}','${kind}')">Upload</button>
    </div><div class="grid" id="agrid">`;
  if(!r.list.length) h+=`<div class="muted">No uploads yet. Upload one above.</div>`;
  for(const a of r.list){
    const isImg=a.kind==='image';
    h+=`<div class="a" onclick="chooseAsset('${field}','${esc(a.path)}')">
      ${isImg?`<img src="${esc(assetUrl(a.path))}">`:`<div style="height:56px;line-height:56px;font-size:20px">${a.kind==='svga'?'🅢':a.kind==='pag'?'🅟':a.kind==='mp4'?'🎞':'📄'}</div>`}
      <div class="nm">${esc(a.name||a.path.split('/').pop())}</div></div>`;
  }
  h+=`</div><div class="foot"><button class="ghost" onclick="closeModal()">Close</button></div>`;
  openModal(h);
}
function chooseAsset(field,path){
  const inp=document.getElementById('in_'+field);
  if(inp){ inp.value=path; document.getElementById('prev_'+field).src=assetUrl(path); document.getElementById('prev_'+field).style.opacity=1; }
  closeModal();
}
async function uploadAsset(field,kind){
  const f=document.getElementById('upf').files[0];
  if(!f){ toast('Choose a file',1); return; }
  const fd=new FormData(); fd.append('file',f);
  try{ const r=await api('/assets/upload',{method:'POST',body:fd}); toast('Uploaded'); chooseAsset(field,r.path); }
  catch(e){ toast(e.message,1); }
}

// ── users & balances ──────────────────────────────────────────────────
async function showUsers(){
  CUR='__users';
  const m=document.getElementById('main');
  m.innerHTML=`<div class="head"><h2>Users &amp; Balances</h2>
    <div class="toolbar"><input id="uq" placeholder="uid or nickname…" onkeydown="if(event.key==='Enter')searchUsers(this.value)">
    <button onclick="searchUsers(document.getElementById('uq').value)">Search</button></div></div>
    <div id="ulist"><div class="empty">Search for a user by uid or nickname.</div></div>`;
}
async function searchUsers(q){
  if(!q||!q.trim()){ return; }
  const r=await api('/users?q='+encodeURIComponent(q.trim()));
  if(!r.length){ document.getElementById('ulist').innerHTML='<div class="empty">No users found.</div>'; return; }
  let h=`<table><thead><tr><th>uid</th><th>nick</th><th>coins</th><th>diamonds</th><th>vip/noble</th><th></th></tr></thead><tbody>`;
  for(const u of r){
    h+=`<tr><td>${u.uid}</td><td>${esc(u.nick)}</td><td>${u.coins}</td><td>${u.diamonds}</td>
      <td>${u.svip}/${u.noble_level}</td>
      <td class="actions"><button class="ghost sm" onclick="openUser(${u.uid})">Manage</button></td></tr>`;
  }
  document.getElementById('ulist').innerHTML=h+'</tbody></table>';
}
async function openUser(uid){
  const u=await api('/users/'+uid);
  let h=`<h3>${esc(u.nick)} <span class="muted">#${u.uid}</span></h3>
    <div class="stats" style="grid-template-columns:1fr 1fr">
      <div class="stat"><div class="n">${u.coins}</div><div class="l">Coins</div></div>
      <div class="stat"><div class="n">${u.diamonds}</div><div class="l">Diamonds</div></div>
    </div>
    <label>Adjust balance</label>
    <div class="row">
      <select id="adjCur" style="width:130px"><option value="coins">Coins</option><option value="diamonds">Diamonds</option><option value="gold">Gold</option><option value="beans">Beans</option></select>
      <input id="adjAmt" placeholder="+1000 or -500">
      <input id="adjReason" placeholder="reason" style="width:150px">
      <button onclick="adjust(${uid})">Apply</button>
    </div>
    <label>Account</label>
    <div class="row">
      <input id="vipLv" style="width:100px" value="${u.vip_level}" placeholder="vip lvl">
      <button class="ghost" onclick="setVip(${uid})">Set VIP</button>
      <button class="${u.isBanned?'ghost':'danger'}" onclick="setBan(${uid},${u.isBanned?0:1})">${u.isBanned?'Unban':'Ban'}</button>
    </div>
    <label>Recent transactions</label>
    <table><tbody>${u.transactions.slice(0,10).map(t=>`<tr><td>${esc(t.reason)}</td><td class="muted">${t.deltaCoins!=='0'?t.deltaCoins+' c':''} ${t.deltaDiamonds!=='0'?t.deltaDiamonds+' d':''}</td></tr>`).join('')||'<tr><td class="muted">none</td></tr>'}</tbody></table>
    <div class="foot"><button class="ghost" onclick="closeModal()">Close</button></div>`;
  openModal(h);
}
async function adjust(uid){
  const currency=document.getElementById('adjCur').value;
  const amount=Number(document.getElementById('adjAmt').value);
  const reason=document.getElementById('adjReason').value;
  if(!amount){ toast('Enter an amount',1); return; }
  try{ await api('/users/'+uid+'/balance',{method:'POST',body:{currency,amount,reason}}); toast('Balance updated'); openUser(uid); }
  catch(e){ toast(e.message,1); }
}
async function setVip(uid){ try{ await api('/users/'+uid+'/vip',{method:'POST',body:{level:Number(document.getElementById('vipLv').value)||0}}); toast('VIP set'); openUser(uid); }catch(e){ toast(e.message,1); } }
async function setBan(uid,banned){ if(!confirm(banned?'Ban this user?':'Unban this user?'))return; try{ await api('/users/'+uid+'/ban',{method:'POST',body:{banned:!!banned}}); toast('Done'); openUser(uid); }catch(e){ toast(e.message,1); } }

// ── audit ─────────────────────────────────────────────────────────────
async function showAudit(){
  CUR='__audit';
  const r=await api('/audit?limit=150');
  let h=`<div class="head"><h2>Audit Log</h2></div><table><thead><tr><th>when</th><th>admin</th><th>action</th><th>entity</th><th>id</th></tr></thead><tbody>`;
  for(const a of r.list) h+=`<tr><td class="muted">${new Date(a.createdAt).toLocaleString()}</td><td>${esc(a.username)}</td><td>${esc(a.action)}</td><td>${esc(a.entity)}</td><td>${esc(a.entity_id)}</td></tr>`;
  document.getElementById('main').innerHTML=h+'</tbody></table>';
}

// ── admins ────────────────────────────────────────────────────────────
async function showAdmins(){
  CUR='__admins';
  const r=await api('/admins');
  let h=`<div class="head"><h2>Admins</h2><button onclick="newAdmin()">+ New admin</button></div>
    <table><thead><tr><th>id</th><th>username</th><th>role</th><th>active</th><th>last login</th></tr></thead><tbody>`;
  for(const a of r.list) h+=`<tr><td>${a.id}</td><td>${esc(a.username)}</td><td>${esc(a.role)}</td><td>${a.active?'<span class="pill on">yes</span>':'<span class="pill off">no</span>'}</td><td class="muted">${a.lastLoginAt?new Date(a.lastLoginAt).toLocaleString():'never'}</td></tr>`;
  document.getElementById('main').innerHTML=h+'</tbody></table>';
}
function newAdmin(){
  openModal(`<h3>New admin</h3>
    <label>Username</label><input data-f="username">
    <label>Password (min 6)</label><input data-f="password" type="password">
    <label>Role</label><select data-f="role"><option value="editor">Editor</option><option value="admin" selected>Admin</option><option value="super">Super</option></select>
    <div class="foot"><button class="ghost" onclick="closeModal()">Cancel</button><button onclick="saveAdmin()">Create</button></div>`);
}
async function saveAdmin(){
  const o=collectForm();
  try{ await api('/admins',{method:'POST',body:o}); closeModal(); toast('Admin created'); showAdmins(); }catch(e){ toast(e.message,1); }
}

// ── modal ─────────────────────────────────────────────────────────────
function openModal(html){ document.getElementById('modal').innerHTML=html; document.getElementById('scrim').classList.add('on'); }
function closeModal(){ document.getElementById('scrim').classList.remove('on'); }
document.getElementById('scrim').addEventListener('click',e=>{ if(e.target.id==='scrim') closeModal(); });

// ── go ────────────────────────────────────────────────────────────────
boot();
</script>
